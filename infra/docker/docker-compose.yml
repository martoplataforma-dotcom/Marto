name: marto
version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: marto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marto
      POSTGRES_USER: marto
      POSTGRES_PASSWORD: marto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: marto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
